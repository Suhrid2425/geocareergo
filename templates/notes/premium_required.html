{% extends "base.html" %}

{% block title %}
Premium Resource | GeoCareerGo
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="feature-card text-center">

                    <span class="badge bg-dark mb-3">
                        PREMIUM
                    </span>

                    <h2 class="fw-bold">
                        {{ note.title }}
                    </h2>

                    <p class="text-muted mt-3">
                        This study resource is available
                        to premium users.
                    </p>

                    <h3 class="fw-bold mt-4">
                        ₹{{ note.price }}
                    </h3>

                    <button
                        class="btn btn-dark mt-3 px-4"
                        disabled
                    >
                        Buy Premium
                    </button>

                    <p class="text-muted small mt-3">
                        Payment integration will be available soon.
                    </p>

                    <a
                        href="{% url 'notes:note_detail' note.id %}"
                        class="btn btn-outline-dark mt-2"
                    >
                        Back to Note
                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
